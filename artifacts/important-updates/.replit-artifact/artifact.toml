kind = "web"
previewPath = "/"
title = "Important Updates"
description = "A mobile-first daily task app with a discreet PIN-gated private chat, shared tasks, reveal bubbles, journey link, settings, and installable PWA support for two trusted users."
version = "1.0.0"
id = "artifacts/important-updates"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19462

[services.development]
run = "pnpm --filter @workspace/important-updates run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/important-updates", "run", "build" ]
serve = "static"
publicDir = "artifacts/important-updates/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19462"
BASE_PATH = "/"
